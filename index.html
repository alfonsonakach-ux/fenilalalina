<style>
:root{
  --bg:#FBF4F1;--bg-glass:rgba(251,244,241,.88);--card:#FFFFFF;--ink:#4A3B45;--muted:#8E7C87;--line:#F1E4E8;
  --rose:#E7A3B8;--rose-d:#C77393;--rose-l:#FBE6EE;
  --lav:#ECE5F8;--lav-d:#8B76C2;--mint:#DCF1E5;--mint-d:#4E9A72;--peach:#FDEBDD;--peach-d:#A8653F;
  --shadow:0 2px 14px rgba(150,100,120,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#231C21;--bg-glass:rgba(35,28,33,.88);--card:#30272D;--ink:#F3E8EE;--muted:#B9A6B1;--line:#40353C;
    --rose:#C77393;--rose-d:#EBA3BE;--rose-l:#4A2F3B;
    --lav:#3A3250;--lav-d:#C3B3EE;--mint:#2A3F34;--mint-d:#8FD3AE;--peach:#45352B;--peach-d:#F1B791;
    --shadow:0 2px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh}
body.lock{overflow:hidden}
button{font-family:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:5;background:var(--bg-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 20px 12px}
header h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.3px}
header .sub{color:var(--muted);font-size:15px}
.gear{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--muted);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.gear svg{width:24px;height:24px}
.view{padding:6px 0 calc(104px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:24px;padding:18px;margin:0 16px 14px;box-shadow:var(--shadow)}
.card h2{font-size:19px;margin:0 0 10px;font-weight:700}
.pad{padding:0 16px}
.label{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.big{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.unit{font-size:18px;font-weight:600;color:var(--muted);letter-spacing:0}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.limit{color:var(--muted);font-weight:600;padding-bottom:6px}
.bar{height:18px;background:var(--rose-l);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--rose-d));border-radius:99px;transition:width .45s ease}
.fill.full{background:linear-gradient(90deg,var(--lav-d),var(--rose-d))}
.msg{margin:10px 0 2px;font-size:17px}
.help{font-size:14px;color:var(--muted);margin-top:6px}
.btn{display:block;width:100%;min-height:54px;border-radius:18px;border:0;background:var(--rose-d);color:#fff;font-size:17px;font-weight:700;margin-top:12px;padding:0 16px}
@media (prefers-color-scheme: dark){.btn{color:#2A1F25}}
.btn:active,.add-btn:active,.round:active,.dose:active{transform:scale(.97)}
.btn.soft{background:var(--rose-l);color:var(--rose-d)}
.btn.ghost{background:transparent;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child,.ghead+.item{border-top:0}
.grow{flex:1;min-width:0}
.name{font-weight:600}
.meta{font-size:14px;color:var(--muted)}
.phe{font-weight:700;font-size:15px;white-space:nowrap}
.icon-btn{width:42px;height:42px;border-radius:14px;border:0;background:var(--bg);color:var(--muted);font-size:17px;flex:none}
.add-btn{border:0;background:var(--rose-l);color:var(--rose-d);font-weight:700;font-size:14px;border-radius:14px;padding:0 12px;min-height:44px;flex:none}
.pickrow{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit}
.pickrow .plus{width:40px;height:40px;border-radius:50%;background:var(--rose-l);color:var(--rose-d);display:grid;place-items:center;font-size:24px;font-weight:600;flex:none}
.ghead{font-size:14px;font-weight:700;color:var(--muted);margin:16px 0 2px}
.ghead:first-child{margin-top:0}
.mine{font-size:12px;background:var(--lav);color:var(--lav-d);border-radius:8px;padding:2px 7px;margin-left:4px;font-weight:700}
.empty{color:var(--muted);text-align:center;margin:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.in{padding:10px 0 8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:0 16px;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;min-height:44px;flex:none}
.chip.on{background:var(--rose-l);border-color:var(--rose);color:var(--rose-d)}
.search{margin:0 16px 10px}
input,textarea{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.sheet input,.sheet textarea{background:var(--bg)}
input:focus,textarea:focus{border-color:var(--rose)}
input[type=date]{min-height:54px}
textarea{resize:vertical;min-height:180px;line-height:1.5}
label.f{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{position:sticky;top:var(--hdr,70px);z-index:4;margin:0 16px 12px;background:var(--lav);color:var(--lav-d);border-radius:16px;padding:11px 14px;font-size:15px;font-weight:600}
.doses{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-bottom:6px}
.dose{min-height:58px;border-radius:18px;border:1.5px dashed var(--rose);background:transparent;color:var(--rose-d);font-weight:700;font-size:15px}
.dose.on{background:var(--rose-d);border-style:solid;border-color:var(--rose-d);color:#fff}
@media (prefers-color-scheme: dark){.dose.on{color:#2A1F25}}
.check{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;color:var(--ink);font:inherit;min-height:62px}
.box{width:32px;height:32px;border-radius:11px;border:2px solid var(--rose);flex:none;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:700}
.check.on .box{background:var(--mint-d);border-color:var(--mint-d)}
.check.on .name{color:var(--muted)}
.subt{font-size:15px;font-weight:700;color:var(--muted);margin:8px 0 8px}
.water{display:flex;align-items:center;justify-content:space-between;gap:12px}
.round{width:58px;height:58px;border-radius:50%;border:0;background:var(--lav);color:var(--lav-d);font-size:30px;font-weight:600;flex:none;display:grid;place-items:center}
.cups{text-align:center;flex:1}
.cups .n{font-size:36px;font-weight:700;line-height:1.1}
.drops{font-size:18px;letter-spacing:2px;min-height:26px;word-break:break-all}
.allset{background:var(--mint);color:var(--mint-d);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px;margin-top:10px;text-align:center}
details summary{list-style:none;font-weight:700;font-size:19px;display:flex;justify-content:space-between;align-items:center;min-height:30px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"›";transform:rotate(90deg);color:var(--muted);font-size:24px;transition:transform .2s}
details[open] summary::after{transform:rotate(-90deg)}
details[open] summary{margin-bottom:6px}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;font-size:14px;font-weight:700;margin-top:10px}
.pill.ok{background:var(--mint);color:var(--mint-d)}
.pill.out{background:var(--peach);color:var(--peach-d)}
.chart{width:100%;height:auto;display:block}
.chart .ax{font-size:11px;fill:var(--muted)}
.chart .vl{font-size:12.5px;font-weight:700;fill:var(--rose-d)}
.empty-chart{color:var(--muted);text-align:center;padding:40px 10px;background:var(--bg);border-radius:16px}
.legend{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:8px}
.sw{width:18px;height:12px;border-radius:4px;background:var(--mint);display:inline-block}
.guide ul{margin:0;padding-left:20px}
.guide li{margin:7px 0}
.saved{font-size:14px;color:var(--mint-d);font-weight:600;min-height:20px;margin-top:6px}
.overlay{position:fixed;inset:0;background:rgba(60,35,50,.38);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:28px 28px 0 0;padding:8px 20px calc(26px + env(safe-area-inset-bottom));animation:up .25s ease}
.sheet.tall{height:90vh}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:22px;margin:4px 0 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sticky-s{position:sticky;top:-8px;background:var(--card);padding-top:8px;z-index:2}
.stepper{display:flex;align-items:center;justify-content:center;gap:26px;margin:22px 0 8px}
.sval{font-size:42px;font-weight:700;min-width:84px;text-align:center}
.stepper.sm{justify-content:flex-start;margin:4px 0}
.stepper.sm .sval{font-size:30px;min-width:56px}
.preview{text-align:center;color:var(--muted);margin:6px 0 4px}
.preview b{color:var(--ink);font-size:20px}
.note{background:var(--peach);color:var(--peach-d);border-radius:14px;padding:10px 14px;font-size:15px;margin-top:12px}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colorbtn{min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;color:var(--ink);line-height:1.3}
.colorbtn.on{border-color:var(--rose-d);background:var(--rose-l)}
.sec{border-top:1px solid var(--line);margin-top:18px;padding-top:4px}
.medrow{background:var(--bg);border-radius:18px;padding:12px;margin-bottom:10px}
.medrow input{background:var(--card)}
.medrow .two{margin-top:8px}
.medtop{display:flex;gap:8px}
.medtop .icon-btn{background:var(--card);height:auto;min-height:52px}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:16px;font-size:15px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:11.5px;font-weight:600;min-height:56px}
nav.tabs .ic{display:grid;place-items:center;padding:3px 14px;border-radius:14px;transition:background .2s}
nav.tabs svg{width:25px;height:25px}
nav.tabs button.on{color:var(--rose-d)}
nav.tabs button.on .ic{background:var(--rose-l)}
.lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 14px}
.lvl button{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;padding:0 2px}
.lvl button.on{background:var(--lav);border-color:var(--lav-d);color:var(--lav-d)}
.lvl button.on.l0{background:var(--mint);border-color:var(--mint-d);color:var(--mint-d)}
.lvl button.on.l3{background:var(--peach);border-color:var(--peach-d);color:var(--peach-d)}
.symname{font-weight:600;font-size:15px}
.mealchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.mealchips::-webkit-scrollbar{display:none}
.check.sel .box{background:var(--rose-d);border-color:var(--rose-d)}
.kcal{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.bar.lav{background:var(--lav);height:12px;margin:8px 0 0}
.bar.lav .fill{background:linear-gradient(90deg,var(--lav-d),var(--rose-d))}
.banner{display:flex;align-items:center;gap:12px;background:var(--lav)}
.banner .name{color:var(--lav-d)}
.switchrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 0 4px;text-align:left;color:var(--ink);font:inherit}
.sw2{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw2.on{background:var(--mint-d)}
.sw2.on::after{left:23px}
.evtypes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.report{white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:15px;line-height:1.5;background:var(--bg);border-radius:16px;padding:14px 16px;margin:4px 0 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>

function normalize(s){

  var o={version:1,settings:Object.assign({},d.settings,s.settings||{}),
    customFoods:Array.isArray(s.customFoods)?s.customFoods:[],
    meals:Array.isArray(s.meals)?s.meals:[],
    days:(s.days&&typeof s.days==='object')?s.days:{},

}

/* ---------- Utilidades ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function num(v){if(v==null)return NaN;var t=String(v).trim().replace(',','.');if(t==='')return NaN;return Number(t);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return keyOf(new Date());}
function parseKey(k){var p=String(k).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function fmtLong(k){return cap(parseKey(k).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}));}
function fmtShort(k){return parseKey(k).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});}
function fmtAx(k){return parseKey(k).toLocaleDateString('es-MX',{day:'numeric',month:'short'});}
function fmtNum(n,dec){return Number(n).toLocaleString('es-MX',{maximumFractionDigits:dec||0});}
function fmtQty(q){var w=Math.floor(q),h=q-w>0.01;if(!w&&h)return'½';return h?w+'½':String(w);}
function isKey(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)&&!isNaN(parseKey(k).getTime());}
function byDate(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2300);}

function emptyDay(){return{foods:[],formula:[],meds:{},water:0,sym:{},sleep:null,vitals:[],events:[]};}
function getDay(k,create){var d=state.days[k];if(!d){d=emptyDay();if(create)state.days[k]=d;}
  d.foods=d.foods||[];d.formula=d.formula||[];d.meds=d.meds||{};d.water=d.water||0;d.sym=d.sym||{};d.vitals=d.vitals||[];d.events=d.events||[];if(d.sleep===undefined)d.sleep=null;return d;}
function foodKcal(f){if(f.kcal!=null)return Number(f.kcal)||0;var b=f.fid?findFood(f.fid):null;if(!b)b=BASE.filter(function(x){return x.name===f.name&&x.portion===f.portion;})[0];return b&&b.kcal!=null?b.kcal:0;}
function dayKcal(d){var s=state.settings,fk=Number(s.formulaKcal)||0,t=d.foods.reduce(function(a,f){return a+foodKcal(f)*(Number(f.qty)||0);},0);for(var i=0;i<s.formulaDoses;i++)if(d.formula[i])t+=fk;return t;}
function exOn(){var s=state.settings;return !!(s.exOn&&Number(s.exMg)>0);}
function toEx(mg){return mg/Number(state.settings.exMg);}
function foodMeta(x){var p=[esc(x.portion),'~'+fmtNum(x.phe)+' mg Phe'];if(exOn())p.push('≈ '+fmtNum(toEx(x.phe),1)+' int.');if(state.settings.kcalOn){var kc=foodKcal(x);if(kc)p.push('~'+fmtNum(kc)+' kcal');}return p.join(' · ');}
function qtyExtra(f,q){var p=[];if(exOn())p.push('≈ '+fmtNum(toEx(f.phe*q),1)+' intercambios');if(state.settings.kcalOn){var kc=foodKcal(f);if(kc)p.push('~'+fmtNum(Math.round(kc*q))+' kcal');}return p.join(' · ');}
var EVT=['Crisis / convulsión','Ausencia','Aura o sensación rara','Otro'],evType=EVT[0];
function evText(e){return esc([e.time,e.type,e.dur].filter(Boolean).join(' · '));}
function addDays(k,n){var x=parseKey(k);x.setDate(x.getDate()+n);return keyOf(x);}
function daysBetween(a,b){return Math.round((parseKey(b)-parseKey(a))/864e5);}
function labStatus(){var ev=parseInt(state.settings.labEvery,10);if(!(ev>0))return null;var labs=state.labs.slice().sort(byDate),last=labs[labs.length-1];if(!last)return{none:true,ev:ev};var next=addDays(last.date,ev);return{next:next,left:daysBetween(todayKey(),next),ev:ev};}
var SYMS=[['mareo','Mareo'],['palp','Palpitaciones'],['cans','Cansancio']],LV=['Nada','Leve','Medio','Fuerte'];
function hasSym(d){return !!d.sym&&Object.keys(d.sym).some(function(x){return d.sym[x]!=null;});}
function vitText(v){var p=[new Date(v.t).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'})];if(v.pulse)p.push('Pulso '+fmtNum(v.pulse));if(v.sys&&v.dia)p.push('Presión '+fmtNum(v.sys)+'/'+fmtNum(v.dia));return esc(p.join(' · '));}
function dayPhe(d){return d.foods.reduce(function(s,f){return s+(Number(f.phe)||0)*(Number(f.qty)||0);},0);}
function dayHasData(d){return d&&((d.events&&d.events.length)||(d.vitals&&d.vitals.length)||hasSym(d)||d.sleep!=null||(d.foods&&d.foods.length)||(d.formula&&d.formula.some(Boolean))||(d.meds&&Object.keys(d.meds).some(function(k){return d.meds[k];}))||d.water);}
function allFoods(){return BASE.concat(state.customFoods.map(function(c){return Object.assign({custom:true},c);}));}
function findFood(id){return allFoods().filter(function(f){return f.id===id;})[0];}
function validRange(){var s=state.settings;return isFinite(s.rangeMin)&&isFinite(s.rangeMax)&&s.rangeMin!==null&&s.rangeMax!==null&&Number(s.rangeMin)<Number(s.rangeMax);}

var TABS={hoy:{title:'Hoy'},alimentos:{title:'Alimentos',sub:'Phe aproximada por porción'},analisis:{title:'Mis análisis',sub:'Phe en sangre'},peso:{title:'Mi peso',sub:'Registro sencillo'},guia:{title:'Mi guía',sub:'Kosher, México y recordatorios'}};
var tab='hoy',foodQ='',foodF='all',pick={q:'',f:'all'},pending=null,draftMeds=[],draftDoses=4,customColor='g';

function render(){
  $('#title').textContent=TABS[tab].title;

  var v={hoy:viewHoy,alimentos:viewAlimentos,analisis:viewAnalisis,peso:viewPeso,guia:viewGuia}[tab];

/* ---------- Hoy ---------- */
function viewHoy(){
  var k=todayKey(),d=getDay(k),s=state.settings;
  var total=Math.round(dayPhe(d)),lim=Number(s.pheLimit)||0;
  var pct=lim?Math.min(total/lim,1):0,msg;
  if(!lim)msg='Escribe tu límite diario en Ajustes. Lo define tu nutriólogo.';
  else if(total===0)msg='Un día nuevo. Aquí vas sumando lo que comes 💛';
  else if(pct<0.6)msg='Vas muy bien 💛 Te quedan ~'+fmtNum(lim-total)+' mg.';
  else if(pct<1)msg='Vas muy bien. Te quedan ~'+fmtNum(lim-total)+' mg para hoy.';
  else msg='Llegaste a tu límite de hoy. Tu fórmula sin Phe te sigue acompañando 💛';

  var h='',ls=labStatus();
  if(ls&&(ls.none||ls.left<=2)){var lt=ls.none?'Cuando tengas tu primer análisis, regístralo aquí.':ls.left<0?'Ya te toca tu análisis de Phe.':ls.left===0?'Hoy te toca tu análisis de Phe.':'Tu análisis de Phe toca en '+ls.left+' día'+(ls.left===1?'':'s')+'.';
    h+='<div class="card banner"><div class="grow"><div class="name">🩸 '+lt+'</div><div class="meta">Cada '+ls.ev+' días, según tu clínica.</div></div><button class="add-btn" data-a="tab" data-t="analisis">Ir</button></div>';}
  h+='<div class="card"><div class="hero-top"><div><div class="label">Phe de hoy</div><div class="big">'+fmtNum(total)+'<span class="unit"> mg</span></div></div>'+(lim?'<div class="limit">de '+fmtNum(lim)+' mg</div>':'')+'</div>';
  if(lim)h+='<div class="bar"><div class="fill'+(total>=lim?' full':'')+'" style="width:'+(pct*100).toFixed(1)+'%"></div></div>';
  if(exOn())h+='<div class="meta">≈ '+fmtNum(toEx(total),1)+' intercambios'+(lim?' de '+fmtNum(toEx(lim),1):'')+'</div>';
  h+='<p class="msg">'+msg+'</p>';
  if(s.kcalOn){var kc=Math.round(dayKcal(d)),kg=Number(s.kcalGoal)||0;h+='<div class="kcal"><div class="hero-top"><div class="label">Calorías de hoy</div><div class="limit" style="padding:0"><b style="color:var(--ink)">~'+fmtNum(kc)+'</b>'+(kg?' de '+fmtNum(kg):'')+' kcal</div></div>'+(kg?'<div class="bar lav"><div class="fill" style="width:'+Math.min(100,kc/kg*100).toFixed(1)+'%"></div></div>':'')+'</div>';}
  if(!lim)h+='<button class="btn soft" data-a="settings">Escribir mi límite</button>';
  h+='<button class="btn" data-a="add-food">+ Agregar</button>';
  if(state.meals.length)h+='<div class="subt" style="margin-top:16px">⭐ Mis comidas</div><div class="mealchips">'+state.meals.map(function(m){return '<button class="chip" data-a="meal" data-id="'+esc(m.id)+'">'+esc(m.name)+'</button>';}).join('')+'</div>';
  h+='</div>';

  h+='<div class="card"><h2>Lo que comí hoy</h2>';
  if(!d.foods.length)h+='<p class="empty">Aún no hay nada registrado hoy.</p>';
  else h+=d.foods.slice().reverse().map(function(f){
    return '<div class="item"><span>'+COLORS[f.color||'g'].emoji+'</span><div class="grow"><div class="name">'+esc(f.name)+'</div><div class="meta">'+fmtQty(f.qty)+' × '+esc(f.portion)+'</div></div><div class="phe">'+fmtNum(Math.round(f.phe*f.qty))+' mg</div><button class="icon-btn" data-a="eat-del" data-id="'+f.id+'" aria-label="Borrar">✕</button></div>';}).join('');
  if(d.foods.length)h+='<button class="btn soft" data-a="meal-new">⭐ Guardar como comida</button>';
  h+='</div>';

  var n=s.formulaDoses,doneF=0,doses='';
  for(var i=0;i<n;i++){var on=!!d.formula[i];if(on)doneF++;doses+='<button class="dose'+(on?' on':'')+'" data-a="toggle-dose" data-i="'+i+'">'+(on?'✓ ':'')+'Toma '+(i+1)+'</button>';}
  var doneM=0,meds=s.meds.map(function(m){var on=!!d.meds[m.id];if(on)doneM++;
    var det=[m.dose,m.when].filter(Boolean).join(' · ');
    return '<button class="check'+(on?' on':'')+'" data-a="toggle-med" data-id="'+esc(m.id)+'"><span class="box">'+(on?'✓':'')+'</span><span class="grow"><span class="name">'+esc(m.name)+'</span>'+(det?'<br><span class="meta">'+esc(det)+'</span>':'')+'</span></button>';}).join('');
  h+='<div class="card"><h2>Mi checklist</h2><div class="subt">Fórmula</div><div class="doses">'+doses+'</div>'+(s.meds.length?'<div class="subt" style="margin-top:14px">Medicamentos</div>'+meds:'');
  if(doneF===n&&doneM===s.meds.length)h+='<div class="allset">Todo listo por hoy ✨</div>';
  h+='</div>';

  h+='<div class="card"><h2>¿Cómo te sientes hoy?</h2>';
  SYMS.forEach(function(sy){var cur=d.sym[sy[0]];h+='<div class="symname">'+sy[1]+'</div><div class="lvl">'+LV.map(function(l,v){return '<button class="'+(cur===v?'on l'+v:'')+'" data-a="sym" data-s="'+sy[0]+'" data-v="'+v+'">'+l+'</button>';}).join('')+'</div>';});
  h+='<div class="symname">Horas de sueño</div><div class="water" style="margin:6px 0 10px"><button class="round" data-a="sleep-minus" aria-label="Menos">−</button><div class="cups"><div class="n">'+(d.sleep==null?'—':fmtNum(d.sleep,1))+'</div><div class="meta">horas anoche</div></div><button class="round" data-a="sleep-plus" aria-label="Más">+</button></div>';
  if(d.vitals.length)h+=d.vitals.map(function(v){return '<div class="item"><div class="grow"><div class="name">'+vitText(v)+'</div>'+(v.note?'<div class="meta">'+esc(v.note)+'</div>':'')+'</div><button class="icon-btn" data-a="vit-del" data-id="'+esc(v.id)+'" aria-label="Borrar">✕</button></div>';}).join('');
  if(d.events.length)h+=d.events.map(function(e){return '<div class="item"><div class="grow"><div class="name">'+evText(e)+'</div>'+(e.note?'<div class="meta">'+esc(e.note)+'</div>':'')+'</div><button class="icon-btn" data-a="ev-del" data-k="'+k+'" data-id="'+esc(e.id)+'" aria-label="Borrar">✕</button></div>';}).join('');
  h+='<button class="btn soft" data-a="vitals">+ Pulso, presión o nota</button><button class="btn soft" data-a="event">+ Evento para el neurólogo</button></div>';

  h+='<div class="card"><h2>Agua</h2><div class="water"><button class="round" data-a="water-minus" aria-label="Quitar un vaso">−</button><div class="cups"><div class="n">'+d.water+'</div><div class="meta">'+(d.water===1?'vaso':'vasos')+' hoy</div><div class="drops">'+'💧'.repeat(Math.min(d.water,12))+'</div></div><button class="round" data-a="water-plus" aria-label="Agregar un vaso">+</button></div></div>';

  var past=Object.keys(state.days).filter(function(x){return x<k&&isKey(x)&&dayHasData(state.days[x]);}).sort().reverse().slice(0,30);
  if(past.length){
    h+='<div class="card"><details><summary>Días anteriores</summary>'+past.map(function(x){var dd=getDay(x);
      return '<button class="item pickrow" data-a="day" data-k="'+x+'"><div class="grow"><div class="name">'+fmtLong(x)+'</div><div class="meta">Fórmula '+dd.formula.filter(Boolean).length+'/'+n+' · Agua '+dd.water+'</div></div><div class="phe">'+fmtNum(Math.round(dayPhe(dd)))+' mg</div></button>';}).join('')+'</details></div>';
  }
  return h;
}
function openDay(k){
  var d=getDay(k),s=state.settings;
  var h='<div class="grab"></div><h3>'+fmtLong(k)+'</h3><p class="meta">Phe: '+fmtNum(Math.round(dayPhe(d)))+' mg · Fórmula '+d.formula.filter(Boolean).length+'/'+s.formulaDoses+' · Agua '+d.water+'</p>';
  h+=d.foods.length?d.foods.map(function(f){return '<div class="item"><span>'+COLORS[f.color||'g'].emoji+'</span><div class="grow"><div class="name">'+esc(f.name)+'</div><div class="meta">'+fmtQty(f.qty)+' × '+esc(f.portion)+'</div></div><div class="phe">'+fmtNum(Math.round(f.phe*f.qty))+' mg</div></div>';}).join(''):'<p class="empty">Sin alimentos registrados.</p>';
  var taken=s.meds.filter(function(m){return d.meds[m.id];}).map(function(m){return esc(m.name+(m.dose?' '+m.dose:''));});
  if(taken.length)h+='<p class="meta">Medicamentos: '+taken.join(', ')+'</p>';
  var sy=SYMS.filter(function(x){return d.sym[x[0]]!=null;}).map(function(x){return x[1]+': '+LV[d.sym[x[0]]].toLowerCase();});
  if(d.sleep!=null)sy.push('Sueño: '+fmtNum(d.sleep,1)+' h');
  if(sy.length)h+='<p class="meta">'+sy.join(' · ')+'</p>';
  d.vitals.forEach(function(v){h+='<p class="meta">'+vitText(v)+(v.note?' — '+esc(v.note):'')+'</p>';});
  d.events.forEach(function(e){h+='<p class="meta">Evento: '+evText(e)+(e.note?' — '+esc(e.note):'')+'</p>';});
  h+='<button class="btn ghost" data-a="close">Cerrar</button>';
  openSheet(h);
}

function chipsHTML(cur,act){return [['all','Todos'],['g','🟢 Libre'],['y','🟡 Con medida'],['r','🔴 Evitar']].map(function(c){return '<button class="chip'+(cur===c[0]?' on':'')+'" data-a="'+act+'" data-f="'+c[0]+'">'+c[1]+'</button>';}).join('');}
function foodListHTML(q,f,mode){
  var nq=norm(q.trim()),out='',count=0,foods=allFoods();
  if(mode==='picker'&&!nq&&f==='all'&&state.meals.length){out+='<div class="ghead">⭐ Mis comidas</div>'+state.meals.map(function(m){return '<button class="item pickrow" data-a="meal" data-id="'+esc(m.id)+'"><div class="grow"><div class="name">'+esc(m.name)+'</div><div class="meta">'+m.items.length+' alimento'+(m.items.length===1?'':'s')+' · ~'+fmtNum(Math.round(mealPhe(m)))+' mg Phe</div></div><span class="plus">+</span></button>';}).join('');count+=state.meals.length;}
  ['g','y','r'].filter(function(c){return f==='all'||f===c;}).forEach(function(c){
    var items=foods.filter(function(x){return x.color===c&&(!nq||norm(x.name).indexOf(nq)>=0);});
    if(!items.length)return;count+=items.length;
    out+='<div class="ghead">'+COLORS[c].emoji+' '+COLORS[c].label+'</div>';
    out+=items.map(function(x){
      var info='<div class="grow"><div class="name">'+esc(x.name)+(x.custom?'<span class="mine">Mío</span>':'')+'</div><div class="meta">'+foodMeta(x)+'</div></div>';
      if(mode==='picker')return '<button class="item pickrow" data-a="pick" data-id="'+esc(x.id)+'">'+info+'<span class="plus">+</span></button>';
      return '<div class="item">'+info+(x.custom?'<button class="icon-btn" data-a="custom-del" data-id="'+esc(x.id)+'" aria-label="Borrar alimento">🗑</button>':'')+'<button class="add-btn" data-a="pick" data-id="'+esc(x.id)+'">Agregar a hoy</button></div>';
    }).join('');
  });
  if(!count)out='<p class="empty">No encontré “'+esc(q)+'”. Puedes agregarlo como alimento propio.</p><button class="btn soft" data-a="custom-new">+ Agregar alimento propio</button>';
  return out;
}

function lastKeys(n){var out=[],t=new Date();for(var i=n-1;i>=0;i--)out.push(keyOf(new Date(t.getFullYear(),t.getMonth(),t.getDate()-i)));return out;}
function avg(a){return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:null;}
function buildReport(n){
  var s=state.settings,keys=lastKeys(n),k0=keys[0],k1=keys[keys.length-1];
  var reg=keys.filter(function(k){return dayHasData(state.days[k]);}),days=reg.map(function(k){return getDay(k);});

  var ph=days.filter(function(d){return d.foods.length;}).map(dayPhe),lim=Number(s.pheLimit)||0;
  L.push('PHE EN DIETA (aprox.)');

    L.push('Mínimo / máximo: '+fmtNum(Math.round(Math.min.apply(null,ph)))+' / '+fmtNum(Math.round(Math.max.apply(null,ph)))+' mg');

  L.push('');
  if(s.kcalOn){var kcs=days.filter(function(d){return d.foods.length||d.formula.some(Boolean);}).map(dayKcal);L.push('CALORÍAS (aprox.)');
    if(kcs.length)L.push('Promedio: '+fmtNum(Math.round(avg(kcs)))+' kcal/día ('+kcs.length+' días)'+(Number(s.kcalGoal)?' · meta indicada: '+fmtNum(s.kcalGoal)+' kcal':''));else L.push('Sin registro.');L.push('');}
  var nd=s.formulaDoses,tk=0,full=0;
  days.forEach(function(d){var c=0;for(var i=0;i<nd;i++)if(d.formula[i])c++;tk+=c;if(c===nd)full++;});
  L.push('FÓRMULA ('+nd+' tomas al día)');
  if(days.length){L.push('Tomas marcadas: '+tk+' de '+(nd*days.length)+' ('+Math.round(tk/(nd*days.length)*100)+'%)');L.push('Días con todas las tomas: '+full+' de '+days.length);}
  else L.push('Sin registro.');
  L.push('');
  if(s.meds.length){
    L.push('MEDICAMENTOS (días marcados)');
    s.meds.forEach(function(m){var c=days.filter(function(d){return d.meds[m.id];}).length;L.push('- '+[m.name,m.dose,m.when].filter(Boolean).join(' ')+': '+c+' de '+days.length);});
    L.push('');
  }
  var wa=days.filter(function(d){return d.water>0;}).map(function(d){return d.water;});
  if(wa.length){L.push('AGUA: promedio '+fmtNum(avg(wa),1)+' vasos/día');L.push('');}
  var sl=[];
  SYMS.forEach(function(sy){var v=days.filter(function(d){return d.sym[sy[0]]!=null;}).map(function(d){return d.sym[sy[0]];});
    if(v.length)sl.push(sy[1]+': promedio '+fmtNum(avg(v),1)+' · días "fuerte": '+v.filter(function(x){return x===3;}).length+' (de '+v.length+' registrados)');});
  var sleep=days.filter(function(d){return d.sleep!=null;}).map(function(d){return d.sleep;});
  if(sleep.length)sl.push('Sueño: promedio '+fmtNum(avg(sleep),1)+' h ('+sleep.length+' noches)');
  if(sl.length){L.push('SÍNTOMAS (0 nada · 1 leve · 2 medio · 3 fuerte)');L=L.concat(sl);L.push('');}
  var vit=[];
  reg.forEach(function(k){getDay(k).vitals.forEach(function(v){var p=[];if(v.pulse)p.push('pulso '+fmtNum(v.pulse));if(v.sys&&v.dia)p.push('presión '+fmtNum(v.sys)+'/'+fmtNum(v.dia));if(v.note)p.push(v.note);
    vit.push('- '+fmtAx(k)+' '+new Date(v.t).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'})+': '+p.join(', '));});});
  if(vit.length){L.push('PULSO / PRESIÓN / NOTAS');L=L.concat(vit);L.push('');}
  var evs=[];reg.forEach(function(k){getDay(k).events.forEach(function(e){evs.push('- '+fmtAx(k)+' '+[e.time,e.type,e.dur].filter(Boolean).join(' · ')+(e.note?': '+e.note:''));});});
  if(evs.length){L.push('EVENTOS NEUROLÓGICOS ('+evs.length+')');L=L.concat(evs);L.push('');}
  var labs=state.labs.slice().sort(byDate),inP=labs.filter(function(l){return l.date>=k0&&l.date<=k1;});
  L.push('PHE EN SANGRE'+(validRange()?' (meta '+fmtNum(s.rangeMin)+'–'+fmtNum(s.rangeMax)+' µmol/L)':''));
  if(inP.length)inP.forEach(function(l){L.push('- '+fmtShort(l.date)+': '+fmtNum(l.value,1)+' µmol/L');});
  else if(labs.length){var lb=labs[labs.length-1];L.push('Sin resultados en el periodo. Último: '+fmtShort(lb.date)+', '+fmtNum(lb.value,1)+' µmol/L');}
  else L.push('Sin resultados.');
  var lsr=labStatus();if(lsr&&lsr.next)L.push('Próximo análisis: '+fmtShort(lsr.next)+' (cada '+lsr.ev+' días)');
  var ws=state.weights.filter(function(x){return x.date>=k0&&x.date<=k1;}).sort(byDate);
  if(ws.length){L.push('');L.push('PESO');ws.forEach(function(x){L.push('- '+fmtShort(x.date)+': '+fmtNum(x.kg,1)+' kg');});}
  L.push('');
  L.push('Valores de alimentos aproximados. Generado con Mi Guía PKU el '+fmtShort(todayKey())+'.');
  return L.join('\n');
}

/* ---------- Gráficas ---------- */
function nice(r){if(!(r>0))return 1;var e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;return(f<1.5?1:f<3?2:f<7?5:10)*e;}
function lineChart(points,o){
  if(!points.length)return '<div class="empty-chart">'+o.empty+'</div>';
  var W=340,H=210,L=46,R=18,T=22,B=30;
  var pts=points.slice().sort(function(a,b){return a.k<b.k?-1:a.k>b.k?1:0;});
  var ts=pts.map(function(p){return parseKey(p.k).getTime();});
  var x0=ts[0],x1=ts[ts.length-1];if(x1-x0<864e5){x0-=7*864e5;x1+=7*864e5;}
  var vals=pts.map(function(p){return p.y;});if(o.band)vals=vals.concat(o.band);
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),sp=hi-lo;if(sp<=0)sp=Math.max(1,Math.abs(hi)*0.2);
  lo-=sp*0.15;hi+=sp*0.15;if(lo<0)lo=0;
  var step=nice((hi-lo)/4),t0=Math.ceil(lo/step)*step;
  function X(t){return L+(t-x0)/(x1-x0)*(W-L-R);}
  function Y(v){return T+(1-(v-lo)/(hi-lo))*(H-T-B);}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'Gráfica')+'">';
  if(o.band){var yt=Y(o.band[1]),yb=Y(o.band[0]);s+='<rect x="'+L+'" y="'+yt.toFixed(1)+'" width="'+(W-L-R)+'" height="'+Math.max(0,yb-yt).toFixed(1)+'" fill="var(--mint)" rx="6"/>';}
  for(var i=0;i<20;i++){var v=t0+i*step;if(v>hi+1e-9)break;var y=Y(v);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ax">'+fmtNum(+v.toFixed(4),2)+'</text>';}
  var d=pts.map(function(p,i){return(i?'L':'M')+X(ts[i]).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  s+='<path d="'+d+'" fill="none" stroke="var(--rose-d)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){var last=i===pts.length-1;s+='<circle cx="'+X(ts[i]).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(last?6:4.5)+'" fill="'+(last?'var(--rose-d)':'var(--card)')+'" stroke="var(--rose-d)" stroke-width="2.5"/>';});
  var lx=X(ts[ts.length-1]),ly=Y(pts[pts.length-1].y),anc=lx>W-50?'end':lx<L+30?'start':'middle';
  s+='<text x="'+lx.toFixed(1)+'" y="'+Math.max(12,ly-11).toFixed(1)+'" text-anchor="'+anc+'" class="vl">'+fmtNum(pts[pts.length-1].y,o.dec||0)+'</text>';
  if(pts.length===1)s+='<text x="'+X(ts[0]).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" class="ax">'+fmtAx(pts[0].k)+'</text>';
  else s+='<text x="'+L+'" y="'+(H-8)+'" text-anchor="start" class="ax">'+fmtAx(pts[0].k)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" class="ax">'+fmtAx(pts[pts.length-1].k)+'</text>';
  return s+'</svg>';
}

  var mnRaw=$('#setMin').value.trim(),mxRaw=$('#setMax').value.trim(),mn=null,mx=null;
  if(mnRaw!==''||mxRaw!==''){mn=num(mnRaw);mx=num(mxRaw);if(!(mn>=0)||!(mx>0)||mn>=mx){toast('Revisa el rango: el mínimo debe ser menor que el máximo.');return;}}
  var le=$('#setLabEvery').value.trim(),labEvery=null;if(le!==''){labEvery=parseInt(le,10);if(!(labEvery>=1&&labEvery<=365)){toast('Revisa cada cuántos días toca el análisis.');return;}}
  var exMg=num($('#setExMg').value);if(draftEx&&!(exMg>0)){toast('Escribe los mg de Phe por intercambio.');return;}if(!(exMg>0))exMg=null;
  var kGoal=num($('#setKcalGoal').value),fKcal=num($('#setFormulaKcal').value);
  var s=state.settings;s.pheLimit=lim;s.formulaDoses=draftDoses;s.rangeMin=mn;s.rangeMax=mx;
  s.labEvery=labEvery;s.exOn=draftEx;s.exMg=exMg;s.kcalOn=draftKcal;s.kcalGoal=kGoal>0?kGoal:null;s.formulaKcal=fKcal>=0?fKcal:null;
  s.meds=draftMeds.filter(function(m){return String(m.name||'').trim();}).map(function(m){return{id:m.id||('m_'+uid()),name:m.name.trim(),dose:String(m.dose||'').trim(),when:String(m.when||'').trim()};});
  save();closeSheet();render();toast('Ajustes guardados ✓');
}
function exportData(){
  var json=JSON.stringify(Object.assign({app:'mi-guia-pku',exportado:new Date().toISOString()},state),null,2);
  var name='mi-guia-pku-respaldo-'+todayKey()+'.json';
  function fallback(){var url=URL.createObjectURL(new Blob([json],{type:'application/json'}));var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},2000);toast('Respaldo listo');}
  try{var file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Respaldo Mi Guía PKU'}).catch(function(e){if(!e||e.name!=='AbortError')fallback();});return;}
  }catch(e){}
  fallback();
}
function importFile(f){
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var obj;try{obj=JSON.parse(r.result);}catch(e){toast('Ese archivo no es un respaldo válido.');return;}
    if(!obj||typeof obj!=='object'||(!obj.settings&&!obj.days)){toast('Ese archivo no es un respaldo válido.');return;}
    if(!confirm('Esto reemplazará los datos actuales con los del respaldo. ¿Continuar?'))return;
    state=normalize(obj);save();closeSheet();render();toast('Respaldo importado ✓');
  };
  r.readAsText(f);
}

/* ---------- Hoja inferior ---------- */
function openSheet(html,cls){var s=$('#sheet');s.className='sheet'+(cls?' '+cls:'');s.innerHTML=html;$('#overlay').classList.add('open');document.body.classList.add('lock');s.scrollTop=0;}
function closeSheet(){$('#overlay').classList.remove('open');document.body.classList.remove('lock');$('#sheet').innerHTML='';pending=null;}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  if(e.target.id==='overlay'){closeSheet();return;}
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,k=todayKey(),d;
  switch(a){
    case 'tab':tab=el.dataset.t;render();window.scrollTo(0,0);break;
    case 'settings':openSettings();break;
    case 'close':closeSheet();break;
    case 'add-food':openPicker();break;
    case 'pfilter':pick.f=el.dataset.f;$('#pickChips').innerHTML=chipsHTML(pick.f,'pfilter');$('#pickList').innerHTML=foodListHTML(pick.q,pick.f,'picker');break;
    case 'ffilter':foodF=el.dataset.f;render();break;
    case 'pick':var f=findFood(el.dataset.id);if(f)openQty(f);break;
    case 'qty-minus':if(pending){pending.qty=Math.max(0.5,pending.qty-0.5);updateQty();}break;
    case 'qty-plus':if(pending){pending.qty=Math.min(20,pending.qty+0.5);updateQty();}break;
    case 'qty-confirm':
      if(!pending)break;var fd=pending.food;
      getDay(k,true).foods.push({id:uid(),fid:fd.id,name:fd.name,portion:fd.portion,phe:Number(fd.phe)||0,kcal:fd.kcal!=null?fd.kcal:null,color:fd.color,qty:pending.qty,t:Date.now()});
      save();closeSheet();toast('Agregado a hoy ✓');if(tab==='hoy')render();break;
    case 'eat-del':
      d=getDay(k,true);var it=d.foods.filter(function(x){return x.id===el.dataset.id;})[0];
      if(it&&confirm('¿Quitar “'+it.name+'” de hoy?')){d.foods=d.foods.filter(function(x){return x.id!==it.id;});save();render();}break;
    case 'toggle-dose':d=getDay(k,true);var i=+el.dataset.i;d.formula[i]=!d.formula[i];save();render();break;
    case 'toggle-med':d=getDay(k,true);d.meds[el.dataset.id]=!d.meds[el.dataset.id];save();render();break;
    case 'water-plus':d=getDay(k,true);d.water=Math.min(30,d.water+1);save();render();break;
    case 'water-minus':d=getDay(k,true);d.water=Math.max(0,d.water-1);save();render();break;
    case 'day':openDay(el.dataset.k);break;
    case 'custom-new':openCustom();break;
    case 'ccolor':customColor=el.dataset.c;Array.prototype.forEach.call(document.querySelectorAll('.colorbtn'),function(b){b.classList.toggle('on',b.dataset.c===customColor);});break;
    case 'custom-save':
      var nm=$('#cName').value.trim(),po=$('#cPortion').value.trim(),ph=num($('#cPhe').value);
      if(!nm){toast('Escribe el nombre del alimento.');break;}
      if(!po){toast('Escribe la porción.');break;}
      if(!(ph>=0)){toast('Escribe la Phe en mg (puede ser 0).');break;}
      var ckEl=$('#cKcal'),ck=ckEl?num(ckEl.value):NaN;state.customFoods.push({id:'c_'+uid(),name:nm,portion:po,phe:ph,kcal:ck>=0?ck:null,color:customColor});save();closeSheet();render();toast('Alimento guardado ✓');break;
    case 'custom-del':
      var cf=state.customFoods.filter(function(x){return x.id===el.dataset.id;})[0];
      if(cf&&confirm('¿Borrar “'+cf.name+'” de tus alimentos?')){state.customFoods=state.customFoods.filter(function(x){return x.id!==cf.id;});save();render();}break;
    case 'lab-save':
      var ld=$('#labDate').value,lv=num($('#labVal').value);
      if(!isKey(ld)){toast('Elige una fecha.');break;}
      if(!(lv>0&&lv<5000)){toast('Escribe el valor en µmol/L.');break;}
      state.labs.push({id:'l_'+uid(),date:ld,value:lv});save();render();toast('Resultado guardado ✓');break;
    case 'lab-del':if(confirm('¿Borrar este resultado?')){state.labs=state.labs.filter(function(x){return x.id!==el.dataset.id;});save();render();}break;
    case 'w-save':
      var wd=$('#wDate').value,wv=num($('#wVal').value);
      if(!isKey(wd)){toast('Elige una fecha.');break;}
      if(!(wv>=20&&wv<=300)){toast('Escribe tu peso en kg.');break;}
      state.weights.push({id:'w_'+uid(),date:wd,kg:wv});save();render();toast('Peso guardado ✓');break;
    case 'w-del':if(confirm('¿Borrar este registro?')){state.weights=state.weights.filter(function(x){return x.id!==el.dataset.id;});save();render();}break;
    case 'doses-minus':draftDoses=Math.max(1,draftDoses-1);$('#setDoses').textContent=draftDoses;break;
    case 'doses-plus':draftDoses=Math.min(8,draftDoses+1);$('#setDoses').textContent=draftDoses;break;
    case 'med-add':syncDraftMeds();draftMeds.push({id:'m_'+uid(),name:'',dose:'',when:''});$('#medsEdit').innerHTML=medsEditHTML();break;
    case 'med-del':syncDraftMeds();draftMeds.splice(+el.dataset.i,1);$('#medsEdit').innerHTML=medsEditHTML();break;
    case 'meal':openMeal(el.dataset.id);break;
    case 'meal-new':openMealNew();break;
    case 'mealsel':mealSel[+el.dataset.i]=!mealSel[+el.dataset.i];$('#mealSelList').innerHTML=mealSelHTML();break;
    case 'meal-save':
      var mn=$('#mealName').value.trim();
      if(!mn){toast('Ponle un nombre a la comida.');break;}
      var its=getDay(k).foods.filter(function(x,j){return mealSel[j];}).map(function(x){return{fid:x.fid,name:x.name,portion:x.portion,phe:x.phe,kcal:foodKcal(x),color:x.color,qty:x.qty};});
      if(!its.length){toast('Elige al menos un alimento.');break;}
      state.meals.push({id:'meal_'+uid(),name:mn,items:its});save();closeSheet();render();toast('Comida guardada ⭐');break;
    case 'meal-add':
      var ml=state.meals.filter(function(x){return x.id===el.dataset.id;})[0];if(!ml)break;
      d=getDay(k,true);ml.items.forEach(function(x){d.foods.push(Object.assign({},x,{id:uid(),t:Date.now()}));});
      save();closeSheet();toast('“'+ml.name+'” agregada a hoy ✓');if(tab==='hoy')render();break;
    case 'meal-del':
      var md=state.meals.filter(function(x){return x.id===el.dataset.id;})[0];
      if(md&&confirm('¿Borrar la comida “'+md.name+'”? Lo que ya registraste no se borra.')){state.meals=state.meals.filter(function(x){return x.id!==md.id;});save();closeSheet();render();}break;
    case 'sym':d=getDay(k,true);var sv=+el.dataset.v;d.sym[el.dataset.s]=d.sym[el.dataset.s]===sv?null:sv;save();render();break;
    case 'sleep-plus':d=getDay(k,true);d.sleep=d.sleep==null?7:Math.min(16,d.sleep+0.5);save();render();break;
    case 'sleep-minus':d=getDay(k,true);if(d.sleep!=null)d.sleep=d.sleep<=0?null:Math.max(0,d.sleep-0.5);save();render();break;
    case 'vitals':openVitals();break;
    case 'vit-save':
      var vp=num($('#vPulse').value),vs=num($('#vSys').value),vd=num($('#vDia').value),vn=$('#vNote').value.trim(),rec={id:'v_'+uid(),t:Date.now()};
      if(!isNaN(vp)){if(!(vp>=30&&vp<=220)){toast('Revisa el pulso.');break;}rec.pulse=vp;}
      if(!isNaN(vs)||!isNaN(vd)){if(!(vs>=60&&vs<=250&&vd>=30&&vd<=160)){toast('Escribe la presión alta y la baja.');break;}rec.sys=vs;rec.dia=vd;}
      if(vn)rec.note=vn;
      if(!rec.pulse&&!rec.sys&&!rec.note){toast('Escribe al menos un dato.');break;}
      getDay(k,true).vitals.push(rec);save();closeSheet();render();toast('Guardado ✓');break;
    case 'vit-del':if(confirm('¿Borrar este registro?')){d=getDay(k,true);d.vitals=d.vitals.filter(function(x){return x.id!==el.dataset.id;});save();render();}break;
    case 'report':openReport();break;
    case 'rep-days':repDays=+el.dataset.n;$('#repChips').innerHTML=repChips();$('#repText').textContent=buildReport(repDays);break;
    case 'rep-share':var rt=buildReport(repDays);if(navigator.share){navigator.share({title:'Reporte Mi Guía PKU',text:rt}).catch(function(e){if(!e||e.name!=='AbortError')copyText(rt);});}else copyText(rt);break;
    case 'rep-copy':copyText(buildReport(repDays));break;
    case 'tog':
      if(el.dataset.k==='ex'){draftEx=!draftEx;$('#swex').classList.toggle('on',draftEx);$('#exFields').style.display=draftEx?'':'none';}
      else{draftKcal=!draftKcal;$('#swkcal').classList.toggle('on',draftKcal);$('#kcalFields').style.display=draftKcal?'':'none';}break;
    case 'event':openEvent();break;
    case 'evtype':evType=EVT[+el.dataset.i];Array.prototype.forEach.call(document.querySelectorAll('.evtypes .colorbtn'),function(b){b.classList.toggle('on',b===el);});break;
    case 'ev-save':
      var ed=$('#eDate').value;
      if(!isKey(ed)){toast('Elige una fecha.');break;}
      var eday=getDay(ed,true);eday.events.push({id:'e_'+uid(),time:$('#eTime').value||'',type:evType,dur:$('#eDur').value.trim(),note:$('#eNote').value.trim()});
      eday.events.sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0;});
      save();closeSheet();render();toast('Evento guardado');break;
    case 'ev-del':if(confirm('¿Borrar este evento?')){d=getDay(el.dataset.k,true);d.events=d.events.filter(function(x){return x.id!==el.dataset.id;});save();render();}break;
    case 'settings-save':saveSettings();break;
    case 'export':exportData();break;
    case 'import':$('#importFile').click();break;
  }
});
var notesT;
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='foodSearch'){foodQ=t.value;$('#foodList').innerHTML=foodListHTML(foodQ,foodF,'tab');}
  else if(t.id==='pickSearch'){pick.q=t.value;$('#pickList').innerHTML=foodListHTML(pick.q,pick.f,'picker');}
  else if(t.id==='notes'){state.notes=t.value;clearTimeout(notesT);$('#notesSaved').textContent='';notesT=setTimeout(function(){if(save()){var n=$('#notesSaved');if(n)n.textContent='Guardado ✓';}},600);}
});
document.addEventListener('change',function(e){if(e.target.id==='importFile'){importFile(e.target.files[0]);e.target.value='';}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!$('#overlay').classList.contains('open'))render();});
window.addEventListener('resize',setHdr);

/* ---------- Inicio ---------- */
save();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
